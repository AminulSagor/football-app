name: kicscore
description: "Live sports scores, match alerts, fixtures and sports news."
publish_to: 'none'

version: 1.0.1+2

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  get: ^4.7.3
  flutter_screenutil: ^5.9.3
  shared_preferences: ^2.5.5
  firebase_messaging: ^16.2.2
  device_info_plus: ^13.1.0
  package_info_plus: ^10.1.0
  uuid: ^4.5.3
  flutter_timezone: ^5.0.2
  dio: ^5.9.2
  flutter_dotenv: ^6.0.1
  pretty_dio_logger: ^1.4.0
  firebase_app_installations: ^0.4.2+2
  firebase_core: ^4.9.0
  image_picker: ^1.2.2
  webview_flutter: ^4.13.0
  flutter_local_notifications: ^21.0.0
  skeletonizer: ^2.1.3
  cached_network_image: ^3.4.1
  connectivity_plus: ^7.1.1
  flutter_svg: ^2.3.0
  url_launcher: ^6.3.1
  facebook_audience_network: ^1.0.1



dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  change_app_package_name: ^1.5.0

flutter:

  uses-material-design: true

  assets:
    - .env
    - assets/images/
    - assets/icons/
    - assets/logos/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icons/app-icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icons/app-icon.png"
